<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 284" width="600" height="284" role="img" aria-label="A terminal panel of numbers about my public repositories: repos 22 public; languages 15, and one of them is a build system; code 1.6 MB, most of it coursework; stars none yet, the bar is on the floor; since 2024; last push 2026-09-09.">
  <title>the numbers</title>
  <style>
    .bg { fill: #0B0B0D; }
    .edge { fill: none; stroke: #3A0D12; stroke-width: 1; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 17px; }
    .key { fill: #E0434E; }
    .dots { fill: #5A1620; }
    .val { fill: #E8E6E3; }
    .prompt { fill: #4FE07A; }
    .cmd { fill: #E8E6E3; }
    .note { fill: #8E8E96; font-size: 12.5px; }
  </style>
  <rect class="bg" x="0" y="0" width="600" height="284" rx="12"/>
  <rect class="edge" x="8.5" y="8.5" width="583" height="266" rx="10"/>
  <text class="mono prompt" x="32" y="44">$</text>
  <text class="mono cmd" x="52" y="44">gh api me --numbers</text>
  <line x1="32" y1="60" x2="568" y2="60" stroke="#3A0D12" stroke-width="1"/>
    <text class="mono" x="32" y="78"><tspan class="key">repos</tspan><tspan class="dots"> ........ </tspan><tspan class="val">22 public</tspan></text>
    <text class="mono" x="32" y="108"><tspan class="key">languages</tspan><tspan class="dots"> .... </tspan><tspan class="val">15, and one of them is a build system</tspan></text>
    <text class="mono" x="32" y="138"><tspan class="key">code</tspan><tspan class="dots"> ......... </tspan><tspan class="val">1.6 MB, most of it coursework</tspan></text>
    <text class="mono" x="32" y="168"><tspan class="key">stars</tspan><tspan class="dots"> ........ </tspan><tspan class="val">none yet, the bar is on the floor</tspan></text>
    <text class="mono" x="32" y="198"><tspan class="key">since</tspan><tspan class="dots"> ........ </tspan><tspan class="val">2024</tspan></text>
    <text class="mono" x="32" y="228"><tspan class="key">last push</tspan><tspan class="dots"> .... </tspan><tspan class="val">2026-09-09</tspan></text>
  <text class="mono note" x="32" y="266">counted straight from the API, not from a badge on someone else's server.</text>
</svg>
