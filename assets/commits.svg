<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 324" width="520" height="324" role="img" aria-label="Panel of commit habits: weekday 44% of them on a wed; midnight 9 of the last 100; verbs fix 25, add 23, feat 13; length 53 characters, median.">
  <title>commit habits</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 17px; }
    .sm { font-size: 13px; }
    .key { fill: #E0434E; }
    .val { fill: #E8E6E3; }
    .note { fill: #8E8E96; font-size: 12.5px; }
  </style>
  <rect fill="#0B0B0D" x="0" y="0" width="520" height="324" rx="12"/>
  <rect fill="none" stroke="#3A0D12" x="8.5" y="8.5" width="503" height="307" rx="10"/>
  <text class="mono" fill="#4FE07A" x="28" y="42">$</text>
  <text class="mono" fill="#E8E6E3" x="46" y="42">git log --author=me --stat</text>
  <line x1="28" y1="58" x2="492" y2="58" stroke="#3A0D12"/>
  <rect x="31.0" y="131" width="60.3" height="17" rx="2" fill="#42383E"/>
  <text class="mono sm" x="61.1" y="166" text-anchor="middle" fill="#8E8E96">mon</text>
  <rect x="97.3" y="146" width="60.3" height="2" rx="2" fill="#42383E"/>
  <text class="mono sm" x="127.4" y="166" text-anchor="middle" fill="#8E8E96">tue</text>
  <rect x="163.6" y="90" width="60.3" height="58" rx="2" fill="#C1121F"/>
  <text class="mono sm" x="193.7" y="166" text-anchor="middle" fill="#E8E6E3">wed</text>
  <rect x="229.9" y="141" width="60.3" height="7" rx="2" fill="#42383E"/>
  <text class="mono sm" x="260.0" y="166" text-anchor="middle" fill="#8E8E96">thu</text>
  <rect x="296.1" y="143" width="60.3" height="5" rx="2" fill="#42383E"/>
  <text class="mono sm" x="326.3" y="166" text-anchor="middle" fill="#8E8E96">fri</text>
  <rect x="362.4" y="146" width="60.3" height="2" rx="2" fill="#42383E"/>
  <text class="mono sm" x="392.6" y="166" text-anchor="middle" fill="#8E8E96">sat</text>
  <rect x="428.7" y="103" width="60.3" height="45" rx="2" fill="#42383E"/>
  <text class="mono sm" x="458.9" y="166" text-anchor="middle" fill="#8E8E96">sun</text>
  <line x1="28" y1="148" x2="492" y2="148" stroke="#3A0D12"/>
  <text class="mono" x="28" y="200"><tspan class="key">weekday</tspan><tspan fill="#5A1620"> .... </tspan><tspan class="val">44% of them on a wed</tspan></text>
  <text class="mono" x="28" y="228"><tspan class="key">midnight</tspan><tspan fill="#5A1620"> ... </tspan><tspan class="val">9 of the last 100</tspan></text>
  <text class="mono" x="28" y="256"><tspan class="key">verbs</tspan><tspan fill="#5A1620"> ...... </tspan><tspan class="val">fix 25, add 23, feat 13</tspan></text>
  <text class="mono" x="28" y="284"><tspan class="key">length</tspan><tspan fill="#5A1620"> ..... </tspan><tspan class="val">53 characters, median</tspan></text>
  <text class="mono note" x="28" y="308">the last 100 commits, straight from the API</text>
</svg>
