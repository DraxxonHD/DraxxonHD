name: Generate snake animation

on:
  schedule:
    # täglich 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: DraxxonHD
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230B0B0D&color_dots=%23EFE6E7,%23F0B0B6,%23DE5F6C,%23C1121F,%237A0B14
            dist/github-contribution-grid-snake-dark.svg?color_snake=%234FE07A&color_dots=%23161619,%233A0D12,%237A0B14,%23A50F1A,%23C1121F

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Redraw the chart and the numbers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen-languages.py

      - name: Redraw the four data panels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_sections.py

      - name: Commit it if it moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: refresh the numbers"
          git push
